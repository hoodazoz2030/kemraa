name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kemraa
          POSTGRES_PASSWORD: kemraa_dev
          POSTGRES_DB: kemraa
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U kemraa"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kemraa/api typecheck
      - name: Prisma migrate
        run: pnpm --filter @kemraa/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://kemraa:kemraa_dev@localhost:5432/kemraa?schema=public
      - run: pnpm --filter @kemraa/api build

  admin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kemraa/admin typecheck
      - run: pnpm --filter @kemraa/admin build